<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="emberGlow" cx="82%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#b34700" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow2" cx="6%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9a8"/>
      <stop offset="35%" stop-color="#ffa94d"/>
      <stop offset="70%" stop-color="#e85d04"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a3200" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="scanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c42" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ff8c42" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7a3200"/>
      <stop offset="100%" stop-color="#ffa94d"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="hClip"><rect x="0" y="0" width="1200" height="260" rx="16"/></clipPath>
    <clipPath id="floorClip"><rect x="0" y="185" width="1200" height="75"/></clipPath>
    <clipPath id="typeClip"><rect x="58" y="0" width="0" height="260">
      <animate attributeName="width" from="0" to="400" dur="1.6s" begin="0.4s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <style>
    .nd { animation: ndpulse var(--dur) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ndpulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
    .fadeUp { opacity: 0; animation: fu .7s cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes fu { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .ember { opacity: 0; transform-box: fill-box; animation: rise var(--dur) linear infinite; animation-delay: var(--del); }
    @keyframes rise {
      0% { transform: translate(0,0); opacity: 0; }
      12% { opacity: var(--op); }
      80% { opacity: var(--op); }
      100% { transform: translate(var(--dx), -250px); opacity: 0; }
    }
    .gridmove { animation: gridScroll 3.2s linear infinite; }
    @keyframes gridScroll { from { transform: translateY(0); } to { transform: translateY(70px); } }
    .sweep { animation: hSweep 7s linear infinite; animation-delay: 2s; opacity: 0; }
    @keyframes hSweep {
      0% { transform: translateY(-80px); opacity: 0; }
      8% { opacity: 1; }
      50% { opacity: 1; }
      60% { transform: translateY(280px); opacity: 0; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    .bracket { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .9s ease-out 1.1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .cursor { opacity: 0; animation: blink 1.1s linear infinite; animation-delay: 2.1s; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .nameGlow { animation: glowPulse 4s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity: .3; } 50% { opacity: .7; } }
    .streak { stroke-dasharray: 140 2772; animation: borderRun 9s linear infinite; }
    @keyframes borderRun { from { stroke-dashoffset: 2912; } to { stroke-dashoffset: 0; } }
    .eq { transform-box: fill-box; transform-origin: center bottom; animation: eq var(--dur) ease-in-out infinite alternate; animation-delay: var(--del); animation-fill-mode: backwards; }
    @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    .barfill { transform-box: fill-box; transform-origin: left center; animation: load 3.4s ease-in-out infinite; }
    @keyframes load { 0% { transform: scaleX(.06); } 60% { transform: scaleX(1); } 82% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  </style>

  <g clip-path="url(#hClip)">
    <rect width="1200" height="260" fill="#0d0d0d"/>
    <rect width="1200" height="260" fill="url(#emberGlow)"/>
    <rect width="1200" height="260" fill="url(#emberGlow2)"/>

    <!-- perspective grid floor -->
    <g clip-path="url(#floorClip)">
      <g class="gridmove" stroke="#3a2417" stroke-width="1">
        <line x1="0" y1="185" x2="1200" y2="185"/><line x1="0" y1="191" x2="1200" y2="191"/>
        <line x1="0" y1="199" x2="1200" y2="199"/><line x1="0" y1="209" x2="1200" y2="209"/>
        <line x1="0" y1="221" x2="1200" y2="221"/><line x1="0" y1="235" x2="1200" y2="235"/>
        <line x1="0" y1="251" x2="1200" y2="251"/>
        <line x1="0" y1="115" x2="1200" y2="115"/><line x1="0" y1="121" x2="1200" y2="121"/>
        <line x1="0" y1="129" x2="1200" y2="129"/><line x1="0" y1="139" x2="1200" y2="139"/>
        <line x1="0" y1="151" x2="1200" y2="151"/><line x1="0" y1="165" x2="1200" y2="165"/>
        <line x1="0" y1="181" x2="1200" y2="181"/>
      </g>
      <g stroke="#4a2c14" stroke-width="1" opacity="0.13">
        <line x1="600" y1="148" x2="-240" y2="260"/><line x1="600" y1="148" x2="-120" y2="260"/>
        <line x1="600" y1="148" x2="0" y2="260"/><line x1="600" y1="148" x2="120" y2="260"/>
        <line x1="600" y1="148" x2="240" y2="260"/><line x1="600" y1="148" x2="360" y2="260"/>
        <line x1="600" y1="148" x2="480" y2="260"/><line x1="600" y1="148" x2="600" y2="260"/>
        <line x1="600" y1="148" x2="720" y2="260"/><line x1="600" y1="148" x2="840" y2="260"/>
        <line x1="600" y1="148" x2="960" y2="260"/><line x1="600" y1="148" x2="1080" y2="260"/>
        <line x1="600" y1="148" x2="1200" y2="260"/><line x1="600" y1="148" x2="1320" y2="260"/>
        <line x1="600" y1="148" x2="1440" y2="260"/>
      </g>
    </g>

    <!-- circuit traces : left cluster -->
    <g fill="none" stroke="#4a2c14" stroke-width="1.2">
      <path d="M18 56 H110 V96 H196"/>
      <path d="M18 88 H84 V148 H170 V188"/>
      <path d="M18 198 H64 V158 H142"/>
      <path d="M18 232 H132 V210 H218"/>
    </g>
    <!-- circuit traces : right cluster -->
    <g fill="none" stroke="#4a2c14" stroke-width="1.2">
      <path d="M1182 52 H1096 V92 H1006"/>
      <path d="M1182 118 H1114 V168 H1030"/>
      <path d="M1182 198 H1104 V158 H1016 V128"/>
      <path d="M1182 232 H1064 V212 H986"/>
    </g>

    <!-- circuit nodes -->
    <circle cx="18" cy="56" r="2.4" fill="#ff8c42" class="nd" style="--dur:3.4s; animation-delay:.4s"/>
    <circle cx="110" cy="96" r="2.8" fill="#ffa94d" class="nd" style="--dur:2.9s; animation-delay:1.6s"/>
    <circle cx="196" cy="96" r="2.2" fill="#ff8c42" class="nd" style="--dur:3.8s; animation-delay:.9s"/>
    <circle cx="84" cy="148" r="2.6" fill="#ffa94d" class="nd" style="--dur:3.1s; animation-delay:2.2s"/>
    <circle cx="170" cy="188" r="2.9" fill="#ff8c42" class="nd" style="--dur:2.7s; animation-delay:.2s"/>
    <circle cx="64" cy="158" r="2.3" fill="#ffa94d" class="nd" style="--dur:3.6s; animation-delay:1.1s"/>
    <circle cx="142" cy="158" r="2.5" fill="#ff8c42" class="nd" style="--dur:3.3s; animation-delay:2.8s"/>
    <circle cx="132" cy="210" r="2.4" fill="#ffa94d" class="nd" style="--dur:2.8s; animation-delay:1.9s"/>
    <circle cx="218" cy="210" r="2.7" fill="#ff8c42" class="nd" style="--dur:3.5s; animation-delay:.7s"/>
    <circle cx="1096" cy="92" r="2.8" fill="#ffa94d" class="nd" style="--dur:3.2s; animation-delay:1.3s"/>
    <circle cx="1006" cy="92" r="2.2" fill="#ff8c42" class="nd" style="--dur:2.6s; animation-delay:.5s"/>
    <circle cx="1114" cy="168" r="2.6" fill="#ff8c42" class="nd" style="--dur:3.7s; animation-delay:2.4s"/>
    <circle cx="1030" cy="168" r="2.9" fill="#ffa94d" class="nd" style="--dur:2.9s; animation-delay:1s"/>
    <circle cx="1104" cy="158" r="2.3" fill="#ff8c42" class="nd" style="--dur:3.4s; animation-delay:.1s"/>
    <circle cx="1016" cy="128" r="2.5" fill="#ffa94d" class="nd" style="--dur:3s; animation-delay:2s"/>
    <circle cx="1064" cy="212" r="2.4" fill="#ff8c42" class="nd" style="--dur:3.6s; animation-delay:1.5s"/>
    <circle cx="986" cy="212" r="2.7" fill="#ffa94d" class="nd" style="--dur:2.8s; animation-delay:.8s"/>

    <!-- data pulses travelling the traces -->
    <circle r="2.2" fill="#ffa94d"><animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite" path="M18 56 H110 V96 H196"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="2.2" fill="#ff8c42"><animateMotion dur="3.8s" begin="1.4s" repeatCount="indefinite" path="M18 88 H84 V148 H170 V188"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="3.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="2.2" fill="#ffa94d"><animateMotion dur="2.9s" begin="2.2s" repeatCount="indefinite" path="M18 232 H132 V210 H218"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.9s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle r="2.2" fill="#ff8c42"><animateMotion dur="3.4s" begin="0.9s" repeatCount="indefinite" path="M1182 52 H1096 V92 H1006"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="2.2" fill="#ffa94d"><animateMotion dur="3s" begin="2.6s" repeatCount="indefinite" path="M1182 118 H1114 V168 H1030"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="3s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle r="2.2" fill="#ff8c42"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M1182 198 H1104 V158 H1016 V128"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>

    <!-- rising embers -->
    <circle cx="120" cy="262" r="1.4" fill="#ff8c42" class="ember" style="--dur:5.5s; --del:0s; --dx:10px; --op:.55"/>
    <circle cx="210" cy="264" r="2.2" fill="#ffa94d" class="ember" style="--dur:7s; --del:1.2s; --dx:-14px; --op:.8"/>
    <circle cx="320" cy="262" r="1.6" fill="#e85d04" class="ember" style="--dur:6.2s; --del:2.4s; --dx:18px; --op:.6"/>
    <circle cx="415" cy="265" r="2.6" fill="#ff8c42" class="ember" style="--dur:8s; --del:.6s; --dx:-8px; --op:.85"/>
    <circle cx="505" cy="263" r="1.3" fill="#ffa94d" class="ember" style="--dur:5s; --del:3.1s; --dx:12px; --op:.5"/>
    <circle cx="610" cy="264" r="2" fill="#e85d04" class="ember" style="--dur:6.6s; --del:1.8s; --dx:-16px; --op:.7"/>
    <circle cx="700" cy="262" r="1.5" fill="#ff8c42" class="ember" style="--dur:5.8s; --del:4s; --dx:8px; --op:.6"/>
    <circle cx="790" cy="265" r="2.4" fill="#ffa94d" class="ember" style="--dur:7.4s; --del:.9s; --dx:-12px; --op:.8"/>
    <circle cx="880" cy="263" r="1.7" fill="#e85d04" class="ember" style="--dur:6s; --del:2.8s; --dx:14px; --op:.65"/>
    <circle cx="960" cy="264" r="2.1" fill="#ff8c42" class="ember" style="--dur:7.8s; --del:1.5s; --dx:-10px; --op:.75"/>
    <circle cx="1040" cy="262" r="1.4" fill="#ffa94d" class="ember" style="--dur:5.4s; --del:3.6s; --dx:16px; --op:.55"/>
    <circle cx="1120" cy="265" r="2.5" fill="#e85d04" class="ember" style="--dur:8.4s; --del:.3s; --dx:-18px; --op:.8"/>
    <circle cx="260" cy="263" r="1.8" fill="#ff8c42" class="ember" style="--dur:6.4s; --del:2s; --dx:6px; --op:.6"/>
    <circle cx="830" cy="262" r="1.5" fill="#ffa94d" class="ember" style="--dur:5.2s; --del:4.4s; --dx:-6px; --op:.5"/>

    <!-- scan band -->
    <rect class="sweep" x="0" y="0" width="1200" height="70" fill="url(#scanBand)"/>

    <!-- HUD corner brackets -->
    <g class="bracket" fill="none" stroke="#ff8c42" stroke-width="2">
      <path d="M14 34 V18 Q14 14 18 14 H34"/>
      <path d="M1166 14 H1182 Q1186 14 1186 18 V34"/>
      <path d="M1186 226 V242 Q1186 246 1182 246 H1166"/>
      <path d="M34 246 H18 Q14 246 14 242 V226"/>
    </g>

    <!-- typewriter boot line -->
    <g clip-path="url(#typeClip)">
      <text x="60" y="58" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#9a8f83">naveed@dev:~$ ./init.sh --profile=naveed-gung</text>
    </g>
    <rect x="446" y="46" width="9" height="16" fill="#e85d04" class="cursor"/>

    <!-- name -->
    <text x="60" y="126" class="nameGlow" filter="url(#softGlow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="#e85d04">NAVEED SOHAIL GUNG</text>
    <text x="60" y="126" class="fadeUp" style="animation-delay:.25s" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="url(#nameGrad)">NAVEED SOHAIL GUNG</text>

    <!-- subtitle + tagline -->
    <text x="62" y="158" class="fadeUp" style="animation-delay:.5s" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#ff8c42">Full-Stack Engineer · Software Craftsman · Security Builder</text>
    <text x="62" y="184" class="fadeUp" style="animation-delay:.7s" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#9a8f83">Beirut, Lebanon — design → API → data → deploy, owned end-to-end</text>

    <!-- live status panel -->
    <g class="fadeUp" style="animation-delay:.9s">
      <rect x="920" y="64" width="224" height="118" rx="10" fill="#141414" stroke="#3a2417"/>
      <circle cx="940" cy="84" r="3.5" fill="#ff8c42" class="nd" style="--dur:2s"/>
      <text x="952" y="88" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#e85d04">LIVE.STATUS</text>
      <line x1="932" y1="98" x2="1132" y2="98" stroke="#2a1c10"/>
      <circle cx="942" cy="112" r="2.5" fill="#ffa94d"/>
      <text x="954" y="116" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" fill="#e8e2da">build: passing ✓</text>
      <circle cx="942" cy="132" r="2.5" fill="#ffa94d"/>
      <text x="954" y="136" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" fill="#e8e2da">focus: full-stack · 3D</text>
      <circle cx="942" cy="152" r="2.5" fill="#ffa94d"/>
      <text x="954" y="156" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" fill="#e8e2da">mode: shipping</text>
      <rect x="932" y="166" width="200" height="6" rx="3" fill="#1f150c"/>
      <rect x="932" y="166" width="200" height="6" rx="3" fill="#e85d04" class="barfill"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="16" fill="none" stroke="url(#hBorder)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="none" stroke="#ffa94d" stroke-width="1.6" class="streak" opacity="0.8"/>
</svg>
