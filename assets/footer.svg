<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a3200" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e85d04" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fBarGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7a3200"/>
      <stop offset="100%" stop-color="#ffa94d"/>
    </linearGradient>
    <linearGradient id="fScanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c42" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff8c42" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fClip"><rect x="0" y="0" width="1200" height="140" rx="16"/></clipPath>
  </defs>

  <style>
    .nd { animation: ndpulse var(--dur) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ndpulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
    .fadeUp { opacity: 0; animation: fu .7s cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes fu { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .ember { opacity: 0; transform-box: fill-box; animation: rise var(--dur) linear infinite; animation-delay: var(--del); }
    @keyframes rise {
      0% { transform: translate(0,0); opacity: 0; }
      15% { opacity: var(--op); }
      80% { opacity: var(--op); }
      100% { transform: translate(var(--dx), -120px); opacity: 0; }
    }
    .eq { transform-box: fill-box; transform-origin: center bottom; animation: eq var(--dur) ease-in-out infinite alternate; animation-delay: var(--del); animation-fill-mode: backwards; }
    @keyframes eq { from { transform: scaleY(.22); } to { transform: scaleY(1); } }
    .msg { opacity: 0; font-family: ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 14; fill: #ff8c42; }
    .m1 { animation: msg1 16s linear infinite; }
    .m2 { animation: msg2 16s linear infinite; }
    .m3 { animation: msg3 16s linear infinite; }
    .m4 { animation: msg4 16s linear infinite; }
    @keyframes msg1 { 0%,2% { opacity: 0; } 5%,22% { opacity: 1; } 25%,100% { opacity: 0; } }
    @keyframes msg2 { 0%,27% { opacity: 0; } 30%,47% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes msg3 { 0%,52% { opacity: 0; } 55%,72% { opacity: 1; } 75%,100% { opacity: 0; } }
    @keyframes msg4 { 0%,77% { opacity: 0; } 80%,97% { opacity: 1; } 100% { opacity: 0; } }
    .streak { stroke-dasharray: 120 2552; animation: borderRun 8s linear infinite; }
    @keyframes borderRun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 2672; } }
    .sweep { animation: fSweep 6s linear infinite; animation-delay: 1.5s; opacity: 0; }
    @keyframes fSweep {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 1; }
      55% { opacity: 1; }
      65% { transform: translateY(160px); opacity: 0; }
      100% { transform: translateY(160px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#fClip)">
    <rect width="1200" height="140" fill="#0d0d0d"/>
    <rect width="1200" height="140" fill="url(#fGlow)"/>

    <!-- equalizer : left bank -->
    <g fill="url(#fBarGrad)" opacity="0.85">
      <rect x="70"  y="92" width="9" height="20" rx="2" class="eq" style="--dur:.9s;  --del:0s"/>
      <rect x="90"  y="78" width="9" height="34" rx="2" class="eq" style="--dur:1.3s; --del:.2s"/>
      <rect x="110" y="96" width="9" height="16" rx="2" class="eq" style="--dur:.8s;  --del:.4s"/>
      <rect x="130" y="72" width="9" height="40" rx="2" class="eq" style="--dur:1.5s; --del:.1s"/>
      <rect x="150" y="86" width="9" height="26" rx="2" class="eq" style="--dur:1.1s; --del:.3s"/>
      <rect x="170" y="68" width="9" height="44" rx="2" class="eq" style="--dur:1.6s; --del:.5s"/>
      <rect x="190" y="94" width="9" height="18" rx="2" class="eq" style="--dur:.9s;  --del:.15s"/>
      <rect x="210" y="76" width="9" height="36" rx="2" class="eq" style="--dur:1.4s; --del:.35s"/>
      <rect x="230" y="88" width="9" height="24" rx="2" class="eq" style="--dur:1s;   --del:.25s"/>
      <rect x="250" y="82" width="9" height="30" rx="2" class="eq" style="--dur:1.3s; --del:.45s"/>
    </g>

    <!-- equalizer : right bank -->
    <g fill="url(#fBarGrad)" opacity="0.85">
      <rect x="950"  y="82" width="9" height="30" rx="2" class="eq" style="--dur:1.2s; --del:.05s"/>
      <rect x="970"  y="88" width="9" height="24" rx="2" class="eq" style="--dur:1s;   --del:.3s"/>
      <rect x="990"  y="76" width="9" height="36" rx="2" class="eq" style="--dur:1.4s; --del:.1s"/>
      <rect x="1010" y="94" width="9" height="18" rx="2" class="eq" style="--dur:.9s;  --del:.4s"/>
      <rect x="1030" y="68" width="9" height="44" rx="2" class="eq" style="--dur:1.6s; --del:.2s"/>
      <rect x="1050" y="86" width="9" height="26" rx="2" class="eq" style="--dur:1.1s; --del:.5s"/>
      <rect x="1070" y="72" width="9" height="40" rx="2" class="eq" style="--dur:1.5s; --del:.15s"/>
      <rect x="1090" y="96" width="9" height="16" rx="2" class="eq" style="--dur:.8s;  --del:.35s"/>
      <rect x="1110" y="78" width="9" height="34" rx="2" class="eq" style="--dur:1.3s; --del:.25s"/>
      <rect x="1130" y="92" width="9" height="20" rx="2" class="eq" style="--dur:.9s;  --del:.45s"/>
    </g>

    <!-- rising embers -->
    <circle cx="320" cy="145" r="1.4" fill="#ff8c42" class="ember" style="--dur:4.6s; --del:0s;   --dx:10px;  --op:.55"/>
    <circle cx="400" cy="147" r="2"   fill="#ffa94d" class="ember" style="--dur:5.8s; --del:1.1s; --dx:-12px; --op:.75"/>
    <circle cx="480" cy="144" r="1.6" fill="#e85d04" class="ember" style="--dur:5.2s; --del:2.3s; --dx:14px;  --op:.6"/>
    <circle cx="565" cy="146" r="2.2" fill="#ff8c42" class="ember" style="--dur:6.4s; --del:.5s;  --dx:-8px;  --op:.8"/>
    <circle cx="650" cy="145" r="1.3" fill="#ffa94d" class="ember" style="--dur:4.4s; --del:3s;   --dx:12px;  --op:.5"/>
    <circle cx="735" cy="147" r="1.9" fill="#e85d04" class="ember" style="--dur:5.6s; --del:1.7s; --dx:-14px; --op:.7"/>
    <circle cx="815" cy="144" r="1.5" fill="#ff8c42" class="ember" style="--dur:4.9s; --del:2.7s; --dx:8px;   --op:.6"/>
    <circle cx="890" cy="146" r="2.1" fill="#ffa94d" class="ember" style="--dur:6.1s; --del:.8s;  --dx:-10px; --op:.75"/>

    <!-- center message -->
    <text x="600" y="54" text-anchor="middle" class="fadeUp" style="animation-delay:.1s" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f5efe8">Code is a craft. I ship the whole stack.</text>

    <!-- cycling status line -->
    <text x="600" y="86" text-anchor="middle" class="msg m1">> status: shipping — always shipping</text>
    <text x="600" y="86" text-anchor="middle" class="msg m2">> focus: full-stack · 3D · security</text>
    <text x="600" y="86" text-anchor="middle" class="msg m3">> base: Beirut, Lebanon · remote-friendly</text>
    <text x="600" y="86" text-anchor="middle" class="msg m4">> motto: build it end-to-end. make it real.</text>

    <!-- signature -->
    <text x="600" y="114" text-anchor="middle" class="fadeUp" style="animation-delay:.35s" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#9a8f83">NAVEED SOHAIL GUNG · naveed-gung.dev</text>

    <!-- scan band -->
    <rect class="sweep" x="0" y="0" width="1200" height="40" fill="url(#fScanBand)"/>
  </g>

  <rect x="1" y="1" width="1198" height="138" rx="16" fill="none" stroke="url(#fBorder)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="138" rx="16" fill="none" stroke="#ffa94d" stroke-width="1.6" class="streak" opacity="0.8"/>
</svg>
